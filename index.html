<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6b50c8">
  <meta name="description" content="输入名单，选择收交事项，点击登记已交。支持姓名搜索、男女筛选、删除和名单导出。">
  <title>班长管理器</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./core.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到名单</a>
  <header class="app-header">
    <a class="brand" href="./"><img src="./favicon.svg" alt="" width="30" height="30"><span>班长管理器</span></a>
    <nav class="view-tabs" aria-label="主导航"><button id="tasks-view" aria-pressed="true">收交登记</button><button id="roster-nav" aria-pressed="false">班级名单</button></nav>
    <details id="data-menu" class="data-menu"><summary>更多<span data-icon="chevron"></span></summary><div class="menu-panel"><button id="backup-export"><span data-icon="download"></span>备份数据</button><button id="backup-import"><span data-icon="upload"></span>恢复备份</button><button id="help-button"><span data-icon="help"></span>使用说明</button></div></details>
  </header>
  <main id="main" tabindex="-1">
    <div id="demo-banner" class="demo-banner" hidden><span>这是演示名单</span><button id="start-real">录入我的名单<span data-icon="arrow-right"></span></button></div>
    <div id="storage-error" class="storage-error" role="alert" hidden></div>
    <div class="page-heading"><div><h1 id="page-title">收交登记</h1><button id="class-button" class="class-button" aria-label="修改班级名称"></button></div><button id="primary-action" class="button primary"><span data-icon="plus"></span>新建事项</button></div>
    <section id="task-detail" class="task-detail" aria-label="当前收交事项"></section>
    <section class="list-section" aria-label="同学名单">
      <div class="list-toolbar"><div id="status-filters" class="segmented" aria-label="提交状态筛选"></div><div class="list-actions"><button id="copy-list" class="button subtle"><span data-icon="copy"></span>复制未交</button><button id="export-list" class="button subtle" aria-label="导出当前筛选名单"><span data-icon="download"></span>导出名单</button></div></div>
      <div class="search-row"><label class="search-box" for="search"><span data-icon="search"></span><input id="search" type="search" autocomplete="off" placeholder="搜索姓名或学号" aria-label="搜索姓名或学号"></label><label class="gender-select" for="gender-select">性别<select id="gender-select"><option value="all">全部</option><option value="male">男生</option><option value="female">女生</option><option value="unknown">未设置</option></select></label></div>
      <div id="list-meta" class="list-meta" aria-live="polite"></div>
      <div id="student-list" class="student-list"></div>
      <div class="list-footer"><span id="list-footer"></span><span id="save-status" class="save-status"></span></div>
    </section>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="restore-file" type="file" accept=".json,application/json" hidden>
  <noscript><div class="noscript">请开启浏览器 JavaScript，使用名单搜索和提交登记。</div></noscript>
</body>
</html>
